<!doctype html>
<meta charset="utf-8">
<title>quadbox</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden }
  #grid { display: grid; height: 100%; width: 100% }
  .n1 { grid-template: 1fr / 1fr }
  .n2 { grid-template: 1fr / 1fr 1fr }
  .n3, .n4 { grid-template: 1fr 1fr / 1fr 1fr }
  iframe { border: 0; width: 100%; height: 100%; background: #000 }
</style>
<div id="grid"></div>
<script>
  const params = new URLSearchParams(location.search);
  const ids = (params.get('v') || '').split(',').filter(Boolean).slice(0, 4);
  const grid = document.getElementById('grid');
  grid.className = 'n' + ids.length;
  for (const id of ids) {
    const f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) +
            '?autoplay=1&mute=1&rel=0&playsinline=1';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    grid.appendChild(f);
  }
</script>
